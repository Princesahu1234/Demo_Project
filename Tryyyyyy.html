/* 3. 2x2 Grid Expand / Morph */
        .grid-expand-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            width: 320px;
            height: 320px;
            transition: all 0.5s ease;
        }
        .grid-item {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .grid-expand-container:has(.grid-item:hover) .grid-item:not(:hover) {
            opacity: 0.3;
            transform: scale(0.92);
        }
        .grid-item:hover {
            grid-column: span 2;
            grid-row: span 2;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        </style>
</head>
